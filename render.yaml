services:
  - type: web
    name: agent-backend
    env: docker
    dockerCommand: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2
    plan: standard
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: POSTGRES_URI
        fromDatabase:
          name: agent-postgres
          property: connectionString
      - key: QDRANT_URL
        value: http://agent-qdrant:6333
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

  - type: web
    name: agent-frontend
    env: docker
    dockerCommand: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    plan: starter
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: agent-backend
          property: host
          format: https://{host}
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false

  - type: pserv
    name: agent-qdrant
    env: docker
    dockerfilePath: ./Dockerfile.qdrant
    plan: starter
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 5

databases:
  - name: agent-postgres
    plan: starter